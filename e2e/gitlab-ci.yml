default:
  tags: [turboci]
  image: alpine:3.20

variables:
  GREETING: "hello"
  NESTED: "${GREETING}-world"
  # Image with the docker CLI for test:docker-build (a project variable can
  # point it at a mirror)
  E2E_DOCKER_IMAGE: "docker:27"

stages: [build, test]

build:
  stage: build
  script:
    - echo "commit $CI_COMMIT_SHA on $CI_COMMIT_REF_NAME in $CI_PROJECT_DIR"
    - test "$(cat VERSION)" = "1.0.0"
    - mkdir -p dist vendor
    - echo "built-$CI_COMMIT_SHORT_SHA" > dist/app.txt
    - echo "source map" > dist/app.txt.map
    - echo "dep-from-$CI_PIPELINE_ID" > vendor/lib.txt
    - cd dist
    - export STEP=exported
    - echo "state=$STEP dir=$(basename "$PWD")"
  artifacts:
    paths: [dist/]
    exclude: ["dist/*.map"]
    expire_in: 1 day
  cache:
    key: deps-$CI_COMMIT_REF_SLUG
    paths: [vendor/]

test:artifacts:
  stage: test
  needs: [build]
  script:
    - cat dist/app.txt
    - grep -q "built-$CI_COMMIT_SHORT_SHA" dist/app.txt
    - test ! -e dist/app.txt.map && echo "excluded file not in artifacts"

test:cache:
  stage: test
  script:
    - cat vendor/lib.txt
  cache:
    key: deps-$CI_COMMIT_REF_SLUG
    paths: [vendor/]
    policy: pull

test:services:
  stage: test
  image: redis:7-alpine
  services:
    - name: redis:7-alpine
      alias: cache
  script:
    # No retry loop: the runner waits for the service's port
    - echo "by-alias $(redis-cli -h cache ping)"
    - echo "by-image $(redis-cli -h redis ping)"

test:variables:
  stage: test
  script:
    - echo "masked=$E2E_SECRET"
    - echo "file=$(cat "$E2E_FILE")"
    - test "$NESTED" = "hello-world"

test:failure:
  stage: test
  script:
    - echo "about to fail"
    - exit 3
    - echo "never printed"
  after_script:
    - echo "after_script ran with CI_JOB_STATUS=$CI_JOB_STATUS"
  allow_failure: true

test:bash:
  stage: test
  image: debian:bookworm-slim
  script:
    - '[[ "$CI_COMMIT_REF_NAME" == main ]] && echo "bash syntax ok"'
    - arr=(a b c); echo "array=${arr[2]}"

# Needs the runner setup of e2e/README.md: a Docker daemon service for every
# job, a /cache volume, shm_size and an `environment` entry
test:docker-build:
  stage: test
  image:
    name: $E2E_DOCKER_IMAGE
    entrypoint: [""]
  variables:
    DOCKER_HOST: tcp://docker:2375
    # Reaches the service too: the daemon listens without TLS on 2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker info --format 'daemon {{.ServerVersion}}'
    - printf 'FROM scratch\nCOPY VERSION /VERSION\n' > Dockerfile.e2e
    - docker build -q -f Dockerfile.e2e -t "e2e-build:$CI_PIPELINE_ID" .
    - docker image inspect "e2e-build:$CI_PIPELINE_ID" --format 'built {{.Id}}'

# A private image pulled with a registry login (DOCKER_AUTH_CONFIG or the
# runner's Docker config); runs when E2E_PRIVATE_IMAGE is set
test:private-image:
  stage: test
  rules:
    - if: $E2E_PRIVATE_IMAGE
  image: $E2E_PRIVATE_IMAGE
  script:
    - echo "private image $(. /etc/os-release && echo "$ID $VERSION_ID") pulled"

test:runner-config:
  stage: test
  script:
    - test "$E2E_RUNNER_ENV" = "from-runner" && echo "runner environment ok"
    - shm=$(df -k /dev/shm | awk 'NR==2 {print $2}'); test "$shm" -ge 1000000 && echo "shm ${shm}k"
    - echo "$CI_JOB_ID" > /cache/e2e-last-job && echo "cache volume writable"

test:clone-path:
  stage: test
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_PATH
  script:
    - test "$CI_PROJECT_DIR" = "$CI_BUILDS_DIR/$CI_PROJECT_PATH"
    - test "$PWD" = "$CI_PROJECT_DIR" && test -f VERSION && echo "cloned into $CI_PROJECT_PATH"

# A shell runner (tag E2E_SHELL_TAG) running the host tools E2E_SHELL_CHECK
# needs, e.g. a mobile SDK in the service user's home
test:shell-runner:
  stage: test
  rules:
    - if: $E2E_SHELL_TAG
  tags: [$E2E_SHELL_TAG]
  script:
    - echo "user=$(id -un) home=$HOME dir=$CI_PROJECT_DIR"
    - test -f VERSION
    - eval "$E2E_SHELL_CHECK"

test:cancel:
  stage: test
  rules:
    - if: $E2E_CANCEL
  script:
    - echo "long job started"
    - sleep 300
    - echo "never printed"
  after_script:
    - echo "after_script after cancel"

test:timeout:
  stage: test
  rules:
    - if: $E2E_TIMEOUT
  timeout: 1m
  script:
    - echo "sleeping past the timeout"
    - sleep 300
  after_script:
    - echo "after_script after timeout"
