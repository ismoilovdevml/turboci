<svg xmlns="http://www.w3.org/2000/svg" width="860" height="582" viewBox="0 0 860 582" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Median job time, gitlab-runner 18.5.0 vs TurboCI 0.13.4 on the same host. Lower is better.</title>
<text x="24" y="34" font-size="20" font-weight="600" fill="#e6edf3">Median time on the same host (seconds, lower is better)</text>
<rect x="24" y="52" width="14" height="14" rx="3" fill="#6e7681"/><text x="44" y="64" font-size="14" fill="#9198a1">gitlab-runner 18.5.0</text>
<rect x="214" y="52" width="14" height="14" rx="3" fill="#ff7a33"/><text x="234" y="64" font-size="14" fill="#9198a1">TurboCI 0.13.4</text>
<text x="24" y="120" font-size="15" fill="#e6edf3">Pipeline (5 jobs)</text>
<rect x="230" y="92" width="501.4" height="22" rx="4" fill="#6e7681"/>
<text x="739.4" y="108" font-size="14" fill="#9198a1">13.5 s</text>
<rect x="230" y="118" width="222.9" height="22" rx="4" fill="#ff7a33"/>
<text x="460.9" y="134" font-size="14" font-weight="600" fill="#e6edf3">6.0 s  <tspan fill="#ff7a33">−56%</tspan></text>
<text x="24" y="194" font-size="15" fill="#e6edf3">Upload 50 MB artifact</text>
<rect x="230" y="166" width="248.9" height="22" rx="4" fill="#6e7681"/>
<text x="486.9" y="182" font-size="14" fill="#9198a1">6.7 s</text>
<rect x="230" y="192" width="111.4" height="22" rx="4" fill="#ff7a33"/>
<text x="349.4" y="208" font-size="14" font-weight="600" fill="#e6edf3">3.0 s  <tspan fill="#ff7a33">−55%</tspan></text>
<text x="24" y="268" font-size="15" fill="#e6edf3">Save a cache</text>
<rect x="230" y="240" width="182.0" height="22" rx="4" fill="#6e7681"/>
<text x="420.0" y="256" font-size="14" fill="#9198a1">4.9 s</text>
<rect x="230" y="266" width="96.6" height="22" rx="4" fill="#ff7a33"/>
<text x="334.6" y="282" font-size="14" font-weight="600" fill="#e6edf3">2.6 s  <tspan fill="#ff7a33">−47%</tspan></text>
<text x="24" y="342" font-size="15" fill="#e6edf3">Download artifacts</text>
<rect x="230" y="314" width="167.1" height="22" rx="4" fill="#6e7681"/>
<text x="405.1" y="330" font-size="14" fill="#9198a1">4.5 s</text>
<rect x="230" y="340" width="78.0" height="22" rx="4" fill="#ff7a33"/>
<text x="316.0" y="356" font-size="14" font-weight="600" fill="#e6edf3">2.1 s  <tspan fill="#ff7a33">−53%</tspan></text>
<text x="24" y="416" font-size="15" fill="#e6edf3">Job with a service</text>
<rect x="230" y="388" width="163.4" height="22" rx="4" fill="#6e7681"/>
<text x="401.4" y="404" font-size="14" fill="#9198a1">4.4 s</text>
<rect x="230" y="414" width="89.1" height="22" rx="4" fill="#ff7a33"/>
<text x="327.1" y="430" font-size="14" font-weight="600" fill="#e6edf3">2.4 s  <tspan fill="#ff7a33">−45%</tspan></text>
<text x="24" y="490" font-size="15" fill="#e6edf3">Empty job</text>
<rect x="230" y="462" width="141.1" height="22" rx="4" fill="#6e7681"/>
<text x="379.1" y="478" font-size="14" fill="#9198a1">3.8 s</text>
<rect x="230" y="488" width="63.1" height="22" rx="4" fill="#ff7a33"/>
<text x="301.1" y="504" font-size="14" font-weight="600" fill="#e6edf3">1.7 s  <tspan fill="#ff7a33">−55%</tspan></text>
<text x="24" y="566" font-size="12" fill="#9198a1">Docker executor, docker:dind on every job, 5 rounds per runner. Rocky Linux 9, 32 vCPU, Docker 29.5. See docs: Benchmarks.</text>
</svg>
