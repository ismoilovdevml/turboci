name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          crate_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Restores the cache saved by CI's build-musl job on main
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-musl
          save-if: false
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --locked --release --all-features --target ${{ matrix.target }}
      - name: Package
        run: |
          strip target/${{ matrix.target }}/release/turboci
          cp target/${{ matrix.target }}/release/turboci turboci-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: turboci-${{ matrix.target }}
          path: turboci-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare assets and checksums
        run: |
          mv artifacts/turboci-* .
          # Unsuffixed name kept for install.sh backward compatibility
          cp turboci-x86_64-unknown-linux-musl turboci
          sha256sum turboci turboci-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            turboci
            turboci-*
            SHA256SUMS
          generate_release_notes: true
