name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux musl build (static binary for x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: false

          # macOS builds (covers both Intel and Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      # Cache Rust dependencies for faster builds
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release
        run: |
          cargo build --release --all-features --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          strip target/${{ matrix.target }}/release/turboci || true

      - name: Strip binary (macOS)
        if: contains(matrix.target, 'darwin')
        run: |
          strip target/${{ matrix.target }}/release/turboci || true

      - name: Prepare binary for release
        run: |
          cp target/${{ matrix.target }}/release/turboci turboci-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turboci-${{ matrix.target }}
          path: turboci-${{ matrix.target }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to root
        run: |
          find artifacts -name "*.tar.gz" -exec mv {} . \;
          ls -lh *.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
          body: |
            ## ⚡ TurboCI ${{ github.ref_name }}

            ### 📥 Quick Install

            **Linux (x86_64):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/ismoilovdevml/turboci/main/install.sh | bash
            ```

            **macOS (Intel/Apple Silicon):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/ismoilovdevml/turboci/main/install.sh | bash
            ```

            ### 🗑️ Uninstall

            ```bash
            curl -sSL https://raw.githubusercontent.com/ismoilovdevml/turboci/main/uninstall.sh | bash
            ```

            ### 📦 Pre-built Binaries

            Download the appropriate binary for your platform:
            - `turboci-x86_64-unknown-linux-musl.tar.gz` - Linux x86_64 (static binary, works on all distros)
            - `turboci-x86_64-apple-darwin.tar.gz` - macOS Intel
            - `turboci-aarch64-apple-darwin.tar.gz` - macOS Apple Silicon (M1/M2/M3/M4)

            ### ✨ Features

            - ⚡ Super fast CI/CD runner with distributed caching
            - 🔄 GitLab Runner compatibility with advanced features
            - 📦 Content-based caching with BLAKE3 hashing
            - 🐳 Docker executor support
            - ☁️ Hybrid storage (Redis + S3/MinIO)
            - 📊 Built-in performance monitoring

            ### 🚀 What's Changed

            See commits for details.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
