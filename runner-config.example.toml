# TurboCI Runner Configuration Example
# Copy this file to /etc/turboci-runner/config.toml

# Number of concurrent jobs the runner can execute
concurrent = 4

# How often to check for new jobs (seconds)
check_interval = 3

# GitLab runner token (get from GitLab CI/CD settings)
runner_token = "glrt-YOUR_RUNNER_TOKEN_HERE"

# GitLab instance URL
gitlab_url = "https://gitlab.com"

# CA (PEM) of a GitLab with a self-signed or internal certificate; trusted by
# the runner, and given to jobs as CI_SERVER_TLS_CA_FILE / GIT_SSL_CAINFO
# tls_ca_file = "/etc/turboci-ca.pem"

# HTTP(S) proxy for the runner, its jobs and services; NO_PROXY for jobs also
# gets localhost and the job's service aliases
# proxy = "http://proxy.corp:3128"
# no_proxy = "localhost,.corp.local,10.0.0.0/8"

# Directory the runner writes its state to. When GitLab gives the runner token
# an expiry, the runner resets it after 3/4 of its lifetime and keeps the new
# token here (runner_token.json); a different runner_token above replaces it.
state_dir = "/var/lib/turboci"

# Variables added to every job (they override the job's own), and scripts run
# for every job, as in gitlab-runner's [[runners]] section
# environment = ["KEY=value"]
# pre_get_sources_script = "echo before the checkout"
# post_get_sources_script = "echo after the checkout"
# pre_build_script = "echo before before_script"
# post_build_script = "echo after script"

# Admission control: no job is requested while the host is short of memory
# (MemAvailable, Linux), disk space (builds and cache directories) or CPU
# (1-minute load average, not divided by the CPU count; Linux). Checked before
# every job request; running jobs are never touched. Unset or "0": off
# min_free_memory = "2g"
# min_free_disk = "20g"
# max_load_avg = 16.0

# Prometheus metrics on http://<metrics_listen>/metrics (IP:port; no
# authentication, keep it on loopback or a management network). Unset: off
# metrics_listen = "127.0.0.1:9252"

# ===== CACHE CONFIGURATION =====
cache_enabled = true
# Local job cache (`cache:` in .gitlab-ci.yml), one directory per project
cache_dir = "/var/lib/turboci/cache"
# Cache archives not used for this many days are deleted (0 = keep forever)
cache_max_age_days = 14
# Total size of the cache archives of all projects ("512m", "50g", bytes);
# beyond it the least recently used archives are deleted, whatever their
# project. Unset or "0": no limit (only cache_max_age_days applies)
# cache_max_size = "50g"
# Share the cache between runner hosts through S3-compatible storage
# (MinIO, AWS S3, Ceph, R2, ...); cache_dir stays the local first layer.
# Expire old archives and incomplete multipart uploads with a bucket
# lifecycle rule: the runner never deletes objects
# [cache_s3]
# url = "https://minio.corp:9000/turboci-cache"
# access_key = "..."
# secret_key = "..."

# ===== EXECUTOR CONFIGURATION =====
[executor]
# Executor type: "docker" (default, isolated) or "shell"
# docker = Container execution per job (isolated from the host)
# shell = Direct execution on the host as the runner's user, NO isolation.
#         Only use shell when every project on this runner is trusted.
executor_type = "docker"

# A project's next job reuses its workspace: the checkout is updated with
# `git fetch` instead of cloned again (GIT_STRATEGY=fetch). Workspaces no job
# used for this many days are deleted; 0 deletes each workspace when its job ends.
workspace_max_age_days = 7
# Total size of the kept workspaces of all projects ("512m", "50g", bytes);
# beyond it the least recently used are deleted, never one a job is using.
# Checked at start and every hour. Unset or "0": no limit
# workspace_max_size = "100g"

# Shell executor configuration (used when executor_type = "shell")
[executor.shell]
work_dir = "/var/lib/turboci/builds"

# Docker executor configuration (used when executor_type = "docker")
[executor.docker]
# Default Docker image if job doesn't specify one
default_image = "alpine:latest"

# Run containers in privileged mode (needed for Docker-in-Docker)
privileged = false

# "host:container[:mode]" binds, or a bare container path such as "/cache"
# for a volume that keeps its content between a project's jobs
volumes = []

# Docker network for jobs without services (jobs with services get their own network)
network_mode = "bridge"

# "always" (default, like gitlab-runner), "if-not-present" or "never".
# A job may choose a policy with image:pull_policy only from
# allowed_pull_policies (empty = only pull_policy), so a project cannot use
# "never"/"if-not-present" to run another project's cached private image.
pull_policy = "always"
allowed_pull_policies = []

# Image with git and sh that checks out sources, so job images need neither
helper_image = "alpine/git:latest"

# Resource limits per container (job and services); unset = no limit
# memory = "2g"
# memory_swap = "3g"
# memory_reservation = "1g"
# cpus = 2.0
# shm_size = "1g"
# oom_score_adjust = 500
# Most processes per container, so a fork bomb cannot exhaust the host
# pids_limit = 4096
# Relative CPU weight (Docker's default is 1024): unlike cpus, a container may
# still use idle CPU, it only gets less of it while the CPUs are busy
# cpu_shares = 512

# Storage driver options of job and service containers; size needs overlay2
# on xfs mounted with pquota
# [executor.docker.storage_opt]
# size = "20G"

# tmpfs mounts of job containers (not services): path -> mount options
# [executor.docker.tmpfs]
# "/tmp" = "rw,noexec,size=1g"

# Docker config.json whose "auths" logins are used to pull private images
# (default: ~/.docker/config.json of the service user)
# auth_config_file = "/var/lib/turboci/.docker/config.json"

# Registries reached over HTTP or without certificate checks: docker:dind
# services get --insecure-registry for each (dockerd needs them in daemon.json)
# insecure_registries = ["harbor.old.local"]

# Services started for every job, e.g. a Docker daemon for image builds
# (needs privileged = true). Jobs must set DOCKER_TLS_CERTDIR: "" as well:
# docker:dind otherwise turns on TLS, on port 2375 too
# [[executor.docker.services]]
# name = "docker:27-dind"
# alias = "docker"
# command = ["--host=tcp://0.0.0.0:2375", "--tls=false"]

# Registry CAs (PEM) for docker:dind services, mounted as
# /etc/docker/certs.d/<registry>/ca.crt
# [executor.docker.registry_ca]
# "harbor.corp.local" = "/etc/turboci-registry-ca/harbor.corp.local.pem"
