# TurboCI Runner Configuration Example
# Copy this file to /etc/turboci-runner/config.toml

# Number of concurrent jobs the runner can execute
concurrent = 4

# How often to check for new jobs (seconds)
check_interval = 3

# GitLab runner token (get from GitLab CI/CD settings)
runner_token = "glrt-YOUR_RUNNER_TOKEN_HERE"

# GitLab instance URL
gitlab_url = "https://gitlab.com"

# CA (PEM) of a GitLab with a self-signed or internal certificate; trusted by
# the runner, and given to jobs as CI_SERVER_TLS_CA_FILE / GIT_SSL_CAINFO
# tls_ca_file = "/etc/turboci-ca.pem"

# Directory the runner writes its state to. When GitLab gives the runner token
# an expiry, the runner resets it after 3/4 of its lifetime and keeps the new
# token here (runner_token.json); a different runner_token above replaces it.
state_dir = "/var/lib/turboci"

# ===== CACHE CONFIGURATION =====
cache_enabled = true
# Local job cache (`cache:` in .gitlab-ci.yml), one directory per project
cache_dir = "/var/lib/turboci/cache"
# Cache archives not used for this many days are deleted (0 = keep forever)
cache_max_age_days = 14

# ===== EXECUTOR CONFIGURATION =====
[executor]
# Executor type: "docker" (default, isolated) or "shell"
# docker = Container execution per job (isolated from the host)
# shell = Direct execution on the host as the runner's user, NO isolation.
#         Only use shell when every project on this runner is trusted.
executor_type = "docker"

# Shell executor configuration (used when executor_type = "shell")
[executor.shell]
work_dir = "/var/lib/turboci/builds"

# Docker executor configuration (used when executor_type = "docker")
[executor.docker]
# Default Docker image if job doesn't specify one
default_image = "alpine:latest"

# Run containers in privileged mode (needed for Docker-in-Docker)
privileged = false

# Mount volumes
volumes = []

# Docker network for jobs without services (jobs with services get their own network)
network_mode = "bridge"

# "always" (default, like gitlab-runner), "if-not-present" or "never".
# A job may choose a policy with image:pull_policy only from
# allowed_pull_policies (empty = only pull_policy), so a project cannot use
# "never"/"if-not-present" to run another project's cached private image.
pull_policy = "always"
allowed_pull_policies = []

# Image with git and sh that checks out sources, so job images need neither
helper_image = "alpine/git:latest"

# Resource limits per container (job and services); unset = no limit
# memory = "2g"
# cpus = 2.0
