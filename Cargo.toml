[package]
name = "turboci"
version = "0.2.6"
edition = "2021"
authors = ["TurboCI Team"]
description = "Super fast CI/CD runner with distributed caching and parallel execution"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
blake3 = "1"
rayon = "1"
walkdir = "2"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"
glob = "0.3"
regex = "1"
async-trait = "0.1"
flate2 = "1"
# Runner daemon dependencies (optional feature)
bollard = { version = "0.19", optional = true }
futures-util = { version = "0.3", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
toml = { version = "0.9", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
hyper = { version = "1", features = ["server"], optional = true }
tower = { version = "0.5", optional = true }
axum = { version = "0.8", optional = true }
prometheus = { version = "0.14", optional = true }

[features]
default = []
runner = ["bollard", "futures-util", "aws-sdk-s3", "aws-config", "toml", "uuid", "hyper", "tower", "axum", "prometheus"]
api = ["axum", "prometheus", "hyper", "tower"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "turboci"
path = "src/main.rs"
