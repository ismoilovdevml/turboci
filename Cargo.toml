[package]
name = "turboci"
version = "0.1.0"
edition = "2021"
authors = ["TurboCI Team"]
description = "Super fast CI/CD runner with distributed caching and parallel execution"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
blake3 = "1.5"
rayon = "1.8"
walkdir = "2.4"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"
glob = "0.3"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "turboci"
path = "src/main.rs"
