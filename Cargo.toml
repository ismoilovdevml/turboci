[package]
name = "turboci"
version = "0.1.0"
edition = "2021"
authors = ["TurboCI Team"]
description = "Super fast CI/CD runner with distributed caching and parallel execution"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
blake3 = "1.5"
rayon = "1.8"
walkdir = "2.4"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"
glob = "0.3"
# Runner daemon dependencies
bollard = "0.16"  # Docker API
aws-sdk-s3 = "1.0"  # S3 storage
aws-config = "1.0"
toml = "0.8"  # Config parsing
uuid = { version = "1.6", features = ["v4", "serde"] }
hyper = { version = "0.14", features = ["server"] }
tower = "0.4"
axum = "0.7"  # Metrics API
prometheus = "0.13"  # Metrics

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "turboci"
path = "src/main.rs"
