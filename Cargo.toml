[package]
name = "turboci"
version = "0.7.1"
edition = "2021"
authors = ["TurboCI Team"]
description = "Super fast CI/CD runner with distributed caching and parallel execution"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
blake3 = "1"
base64 = "0.22"
rayon = "1"
walkdir = "2"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "safe_iterators"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
sha2 = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"
glob = "0.3"
regex = "1"
async-trait = "0.1"
flate2 = "1"
zip = { version = "5", default-features = false, features = ["deflate"] }
# Runner daemon dependencies (optional feature)
bollard = { version = "0.19", optional = true }
futures-util = { version = "0.3", optional = true }
toml = { version = "0.9", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
dns-lookup = "2"
tempfile = "3"

[features]
default = []
runner = ["bollard", "futures-util", "toml", "uuid"]

[dev-dependencies]
wiremock = "0.6"

[[bin]]
name = "turboci"
path = "src/main.rs"
