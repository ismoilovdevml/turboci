[package]
name = "turboci"
version = "0.8.0"
edition = "2021"
authors = ["ismoilovdevml"]
description = "GitLab CI/CD runner: one static binary that runs GitLab jobs in Docker containers or on the host"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
blake3 = "1"
base64 = "0.22"
walkdir = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
sha2 = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
glob = "0.3"
regex = "1"
async-trait = "0.1"
flate2 = "1"
zip = { version = "5", default-features = false, features = ["deflate", "zstd"] }
bollard = "0.19"
futures-util = "0.3"
hmac = "0.12"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
dns-lookup = "2"
tempfile = "3"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
wiremock = "0.6"

[[bin]]
name = "turboci"
path = "src/main.rs"
