[package]
name = "turboci"
version = "0.11.0"
edition = "2021"
authors = ["ismoilovdevml"]
description = "GitLab CI/CD runner: one static binary that runs GitLab jobs in Docker containers or on the host"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "fs", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
blake3 = "1"
base64 = "0.22"
walkdir = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
bytes = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["now"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "smallvec", "std", "tracing-log"] }
glob = "0.3"
regex = "1"
aho-corasick = "1.1.5"
# One deflate backend (zlib-rs) for flate2 and zip; zip's "deflate" would add
# miniz_oxide and zopfli, which only serves compression levels above 9.
# runtime_detection lets zlib-rs pick SSE/AVX2 code paths on x86_64.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "zstd"] }
# Docker Engine API client (runner_daemon::docker_api) over dockerd's unix socket
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9.1", default-features = false, features = ["client"] }
http-body-util = "0.1.5"
tokio-util = { version = "0.7.20", features = ["codec", "io"] }
url = "2.5.8"
futures-util = "0.3"
hmac = "0.12"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
dns-lookup = "2"
tempfile = "3"
rustix = { version = "1.1", features = ["fs", "process"] }
# Cache archives (format v2): one zstd stream over a tar of the cached files.
# zstd is the version zip already links; tar without xattr support.
tar = { version = "0.4", default-features = false }
zstd = { version = "0.14.4", default-features = false }

# musl's malloc is slow under multi-threaded load; macOS and glibc keep the system allocator
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
wiremock = "0.6"

[[bin]]
name = "turboci"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# No panic = "abort": a panicking job is caught with catch_unwind, which needs unwinding
